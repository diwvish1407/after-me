# Infrastructure checks: formatting and validation of the Terraform in infra/. No Google credentials,
# no backend, no plan, no apply (an apply is a person at a terminal: infra/README.md).
name: infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform fmt and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - name: Init and validate every root module
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          for dir in bootstrap envs/staging envs/prod; do
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
          done

      - name: Shell scripts parse
        run: for f in infra/scripts/*.sh; do bash -n "$f"; done

      - name: No secret-looking value in the infrastructure code
        run: |
          if grep -rEn --include='*.tf' --include='*.tfvars*' --include='*.sh' --include='*.md' \
               -e 'BEGIN ([A-Z]+ )?PRIVATE KEY' -e 'whsec_[A-Za-z0-9+/=]{16,}' \
               -e 'postgresql\+psycopg://[^:/@ ]+:[A-Za-z0-9]{12,}@' infra; then
            echo "A secret-looking value is in infra/." >&2; exit 1
          fi
