# The signed Android release (docs/RELEASE.md section 3).
#
#   tag app-v<versionName>   -> build the signed prod AAB of that tag
#   workflow_dispatch        -> the same, from main (the version is pubspec.yaml's)
#
# What it does: checks that the commit is on main and that the tag names pubspec.yaml's version;
# refuses a config/prod.json that still has placeholders; writes the UPLOAD key from GitHub
# secrets of the Environment `release` into mobile/android/ (never echoed) and builds with
# mobile/tool/build_release.sh exactly as a person would (no --allow-debug-signing: a missing key
# fails the build); proves the bundle is not signed with the debug key (and, when the variable
# ANDROID_UPLOAD_CERT_SHA256 is set, that it is signed with OUR upload key); wipes the key in an
# always() step; and keeps the AAB, the R8 mapping and the Dart symbols as private workflow
# artifacts for 90 days.
#
# It does NOT publish to Play. Uploading to the internal track is done by hand in Play Console
# (the first upload of a new app must be manual anyway). Keyless publishing (Workload Identity ->
# a service account invited in Play Console -> the Play Developer API) is possible, but needs a
# new identity pool provider and service account that do not exist yet: docs/RELEASE.md section 3.5.
#
# Secrets (GitHub Environment `release`, required reviewer = the owner, deployment rules: branch
# main and tags app-v*):
#   ANDROID_UPLOAD_KEYSTORE_BASE64   base64 of upload-keystore.jks, one line (base64 -w0 / -b 0)
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD
#   ANDROID_UPLOAD_KEY_ALIAS
#   ANDROID_UPLOAD_KEY_PASSWORD
# Variable (optional, same Environment): ANDROID_UPLOAD_CERT_SHA256, the upload certificate's
# SHA-256 fingerprint as Play Console shows it (Setup -> App signing -> Upload key certificate).
#
# Third-party actions are pinned by commit SHA (resolved with `git ls-remote`).

name: release

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Signed prod AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the version and check the commit
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REF_FULL: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' mobile/pubspec.yaml | tr -d '[:space:]')"
          [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([1-9][0-9]*)$ ]] || {
            echo "::error::mobile/pubspec.yaml version must be <major.minor.patch>+<versionCode>, found '$version'"
            exit 1
          }
          name="${BASH_REMATCH[1]}"
          code="${BASH_REMATCH[2]}"
          if [ "$REF_TYPE" = "tag" ]; then
            [ "$REF_NAME" = "app-v$name" ] || {
              echo "::error::tag $REF_NAME does not name pubspec.yaml's version (expected app-v$name)"
              exit 1
            }
          elif [ "$REF_FULL" != "refs/heads/main" ]; then
            echo "::error::a release is built from main or from an app-v* tag (this run: $REF_FULL)"
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          # Only code that is on main is ever released (a tag cut on a side branch is refused).
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error::$sha is not reachable from origin/main"
            exit 1
          }
          {
            echo "name=$name"
            echo "code=$code"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "Building AfterMe $name (versionCode $code) from ${sha:0:12}" >> "$GITHUB_STEP_SUMMARY"

      # config/prod.json is committed with placeholders until the production values exist
      # (docs/RELEASE.md section 3.2). A release built from them would talk to nowhere.
      - name: Refuse a placeholder production configuration
        working-directory: mobile
        run: |
          set -euo pipefail
          if grep -q '\.invalid' config/prod.json; then
            echo "::error::config/prod.json still points at a placeholder (.invalid) domain"
            exit 1
          fi
          for key in FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_PROJECT_ID; do
            if grep -Eq "\"$key\"[[:space:]]*:[[:space:]]*\"\"" config/prod.json; then
              echo "::error::config/prod.json has an empty $key (push would never arrive)"
              exit 1
            fi
          done

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.6

      - name: Get dependencies and generate code
        working-directory: mobile
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get --enforce-lockfile
          dart run build_runner build
          flutter gen-l10n

      # The upload key exists on this runner only between this step and the wipe below. Values
      # come through env (never interpolated into the script), are masked by GitHub, and nothing
      # here prints them (no `set -x`).
      - name: Write the upload key
        working-directory: mobile/android
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in UPLOAD_KEYSTORE_BASE64 UPLOAD_KEYSTORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::the secret ANDROID_${name} is not set in the Environment 'release'"
              exit 1
            fi
          done
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            printf 'storePassword=%s\n' "$UPLOAD_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$UPLOAD_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$UPLOAD_KEY_PASSWORD"
          } > key.properties
          echo "upload key written (values not shown)"

      # Exactly the documented build: prod flavor, config/prod.json, --obfuscate,
      # --split-debug-info, and the merged-manifest check. Without --allow-debug-signing a
      # missing key.properties stops the build instead of producing a debug-signed bundle.
      - name: Build the release bundle (tool/build_release.sh)
        working-directory: mobile
        run: tool/build_release.sh --appbundle --symbols-dir=build/symbols

      - name: Check the signature (upload key, never the debug key)
        working-directory: mobile
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/prodRelease/app-prod-release.aab
          [ -f "$aab" ] || { echo "::error::$aab was not produced"; exit 1; }
          cert="$(keytool -printcert -jarfile "$aab")"
          if grep -q "CN=Android Debug" <<<"$cert"; then
            echo "::error::the bundle is signed with the DEBUG key: never upload it"
            exit 1
          fi
          actual="$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' <<<"$cert" | head -n 1 | tr -d ':[:space:]' | tr 'a-f' 'A-F')"
          [ -n "$actual" ] || { echo "::error::the bundle carries no signature"; exit 1; }
          if [ -n "$EXPECTED_SHA256" ]; then
            expected="$(tr -d ':[:space:]' <<<"$EXPECTED_SHA256" | tr 'a-f' 'A-F')"
            [ "$actual" = "$expected" ] || {
              echo "::error::the bundle is not signed with the upload key Play Console knows"
              exit 1
            }
          else
            echo "::warning::ANDROID_UPLOAD_CERT_SHA256 is not set: the upload certificate was not compared"
          fi
          {
            echo "Upload certificate SHA-256: \`$actual\`"
            echo "AAB SHA-256: \`$(sha256sum "$aab" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wipe the upload key
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          for f in mobile/android/key.properties mobile/android/upload-keystore.jks; do
            if [ -f "$f" ]; then
              shred -u "$f" 2>/dev/null || rm -f "$f"
            fi
          done
          echo "upload key removed from the runner"

      - name: Keep the bundle (private, 90 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: afterme-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-aab
          path: mobile/build/app/outputs/bundle/prodRelease/app-prod-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Keep the R8 mapping (private, 90 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: afterme-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-r8-mapping
          path: mobile/build/app/outputs/mapping/prodRelease/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Keep the Dart symbols (private, 90 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: afterme-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-dart-symbols
          path: mobile/build/symbols
          if-no-files-found: error
          retention-days: 90

      - name: Next steps
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          {
            echo ""
            echo "Next (by hand, docs/RELEASE.md): download the AAB artifact, upload it to Play Console"
            echo "-> Testing -> Internal testing, then attach the R8 mapping (App bundle explorer ->"
            echo "Downloads -> ReTrace mapping file) and the native debug symbols if Play asks."
            echo "Version $NAME ($CODE). Store the mapping and symbols with the release record:"
            echo "artifacts expire after 90 days."
          } >> "$GITHUB_STEP_SUMMARY"
