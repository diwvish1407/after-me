[project]
name = "afterme-backend"
version = "0.1.0"
description = "AfterMe backend: JSON API (Phase 1: auth foundation)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.142.4",
    # The FCM and email provider adapters import httpx at start-up: a runtime dependency, not a
    # test one (an image built without the dev group must still be able to start).
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.150",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.uv]
# The backend is an application, not a library: no build step, `app` is imported from this
# directory (see pythonpath below and prepend_sys_path in alembic.ini).
package = false

# --------------------------------------------------------------------------------------------
# Ruff
# --------------------------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".dev_mail"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "S", "ASYNC", "SIM", "RUF", "N", "PT", "C4", "DTZ", "T20", "PL",
]
ignore = [
    "PLR0913",  # services take explicit keyword arguments instead of opaque option bags
    "PLR0917",
]

[tool.ruff.lint.pylint]
max-returns = 8
max-branches = 14
max-statements = 60

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Path", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is how pytest works
    "S105",     # test passwords and tokens are fixtures, not secrets
    "S106",
    "S107",
    "S311",     # non-crypto randomness is fine in tests
    "PLR2004",  # literal status codes and limits are the point of the assertions
    "PLR0915",
    "PLC0415",  # local imports keep some fixtures lazy
    "RUF001",   # look-alike characters are deliberate test data (display-name and NFKC tests)
    "RUF003",
]
"app/core/errors.py" = [
    "N818",     # error classes are named after the API error codes (NotFound, RateLimited, ...)
]
"migrations/**" = [
    "S608",     # DDL is static, no user input
]
"scripts/**" = ["T201"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------------------------
# pytest / coverage
# --------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # Coverage is opt-in (`make test`, CI pass --cov=app): with it always on, the fail_under gate
    # below would fail every partial run (single file, -k, --lf) even when all tests pass.
]
filterwarnings = ["error"]
markers = [
    "no_rate_limit: run the test with rate limiting disabled",
    "perf: query plans and round trips of the hot paths (tests/perf; a few seconds each)",
]

[tool.coverage.run]
branch = true
source = ["app"]
# SQLAlchemy's asyncio layer switches greenlets; without this, lines after an await go untraced.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
